services:
  Drupal\canvas_override\CanvasOverridePageResolver:
    autowire: true

  Drupal\canvas_override\CanvasOverridePermissions:
    arguments: ['@entity_type.manager']

  canvas_override.access_check:
    class: Drupal\canvas_override\Access\CanvasTabAccessCheck
    arguments: ['@entity_type.manager']
    tags:
      - { name: access_check, applies_to: _canvas_override_access }

  canvas_override.reset_access_check:
    class: Drupal\canvas_override\Access\CanvasResetAccessCheck
    arguments: ['@entity_type.manager']
    tags:
      - { name: access_check, applies_to: _canvas_reset_access }

  Drupal\canvas_override\Hook\CanvasOverrideHooks:
    autowire: true

  # Register the inner (original) constraint validator for injection.
  canvas_override.inner_constraint_validator:
    class: Drupal\canvas\Plugin\Validation\Constraint\ComponentTreeMeetsRequirementsConstraintValidator
    autowire: true

  # Override the constraint validator: ClassResolver checks container->has()
  # with the FQCN returned by Constraint::validatedBy(), so this service ID
  # must match the original validator class name exactly.
  Drupal\canvas\Plugin\Validation\Constraint\ComponentTreeMeetsRequirementsConstraintValidator:
    class: Drupal\canvas_override\Plugin\Validation\Constraint\CanvasOverrideConstraintValidator
    arguments:
      - '@canvas_override.inner_constraint_validator'
      - '@entity_type.manager'
