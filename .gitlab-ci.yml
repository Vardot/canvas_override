################
# DrupalCI GitLab CI configuration for Canvas Override
#
# @see https://www.drupal.org/drupalorg/docs/drupal-ci/customizing-drupalci-testing
################

################
# Includes
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Variables
################
variables:
  OPT_IN_TEST_CURRENT: 1
  OPT_IN_TEST_NEXT_MAJOR: 0
  OPT_IN_TEST_NEXT_MINOR: 0
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  OPT_IN_TEST_PREVIOUS_MINOR: 0
  _TARGET_PHP: "8.3"
  SKIP_ESLINT: 1
  _PHPUNIT_EXTRA: --group canvas_override

################
# Stages
################
stages:
  - 🏗️ Build
  - 🪄 Lint
  - 🗜️ Test

################
# Build
################
composer:
  stage: 🏗️ Build
  variables:
    COMPOSER_EXTRA_DEPENDENCIES: drupal/canvas:^1.2

################
# Lint
################
phpcs:
  stage: 🪄 Lint

phpstan:
  stage: 🪄 Lint

################
# Test
################
phpunit:
  stage: 🗜️ Test
  parallel:
    matrix:
      - TESTSUITE:
        - kernel
        - functional-javascript
        - unit
